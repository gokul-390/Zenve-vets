# ===================================================================
# VetConnect - Test Configuration (H2 In-Memory)
# ===================================================================

spring.application.name=zenve-vet-backend-test
spring.datasource.url=jdbc:h2:mem:zenvevet_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during unit/context test runs unless specific migration tests are executed
spring.flyway.enabled=false
